<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Saya</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Hind+Siliguri:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#14070b;--bg2:#2a0c16;--red:#a3263f;--rose:#e0607a;--ink:#f6ebe3;--soft:#c9a9ae;--glass:rgba(255,235,230,.07);--line:rgba(255,220,215,.18);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#14070b}}
:root[data-theme="light"]{--bg:#14070b}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(circle at 20% 0%,var(--bg2),var(--bg) 60%) fixed;font:18px/1.7 "Hind Siliguri","Segoe UI",sans-serif;overflow-x:hidden}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;margin:0;line-height:1.1}
h1{font-size:clamp(2.8rem,13vw,5rem);font-style:italic}h2{font-size:clamp(2rem,8vw,2.8rem);margin-bottom:8px}
.scene{display:none;min-height:100svh;max-width:640px;margin:0 auto;padding:64px 22px;text-align:center;flex-direction:column;justify-content:center}
.scene.on{display:flex;animation:in 1s ease both}
@keyframes in{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.sub{color:var(--soft);margin:6px 0 22px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{margin:30px auto 0;background:linear-gradient(135deg,var(--red),#701530);border:1px solid var(--line);border-radius:999px;padding:12px 30px;font-family:"Cormorant Garamond",serif;font-size:1.3rem;font-weight:700;box-shadow:0 0 28px rgba(163,38,63,.45)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(8px);padding:18px 20px}
.tl{text-align:left;border-left:2px solid var(--rose);margin:0 0 0 8px;padding:0}
.tl li{list-style:none;position:relative;padding:0 0 22px 22px;opacity:.25;transition:.6s}.tl li.v{opacity:1}
.tl li::before{content:"";position:absolute;left:-8px;top:8px;width:14px;height:14px;border-radius:50%;background:var(--rose);box-shadow:0 0 14px var(--rose)}
.tl b{font-family:"Cormorant Garamond",serif;font-size:1.25rem;color:var(--rose)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{min-height:120px;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);font-size:.98rem;line-height:1.4;display:flex;align-items:center;justify-content:center}
.tile.cover{font-family:"Cormorant Garamond",serif;font-size:1.5rem;background:linear-gradient(135deg,var(--red),#4a0f20)}
.tile.dashed{border-style:dashed;color:var(--soft)}
.scrap{display:grid;grid-template-columns:1fr 1fr;gap:20px 14px;padding:6px}
.pol{background:#f6ebe3;color:#2a0c16;padding:8px 8px 10px;border-radius:4px;box-shadow:0 10px 24px rgba(0,0,0,.5);text-align:center}
.pol:nth-child(odd){transform:rotate(-3deg)}.pol:nth-child(even){transform:rotate(2.5deg)}
.pol img,.pol .ph{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#d9c7bd}
.pol .ph{display:flex;align-items:center;justify-content:center;color:#7a5a60;font-size:.9rem}
.pol p{margin:6px 0 0;font:500 .95rem/1.3 "Cormorant Garamond",serif}
.letter{text-align:left;font-size:1.05rem}.letter p{margin:0 0 14px}.sig{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.5rem;text-align:right;color:var(--rose)}
.env{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.envb{width:96px;height:72px;border-radius:8px;background:linear-gradient(135deg,#f0dcd0,#d9b7ae);color:#4a0f20;border:0;font-size:2rem;box-shadow:0 8px 20px rgba(0,0,0,.45);transition:.5s}
.envb.gone{opacity:.15;pointer-events:none;transform:scale(.9)}
#envmsg{min-height:5em;margin-top:22px}
.lockico{font-size:3.4rem;margin-bottom:10px;user-select:none}
#lf{display:flex;flex-direction:column;align-items:center}
#pw{width:min(320px,86vw);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:12px 22px;color:var(--ink);font:inherit;text-align:center;outline:none}
#pw:focus{border-color:var(--rose);box-shadow:0 0 18px rgba(224,96,122,.35)}
.shake{animation:shk .45s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
#logv{position:fixed;inset:0;z-index:9;background:rgba(10,3,6,.94);padding:calc(24px + env(safe-area-inset-top,0px)) 18px 24px;overflow:auto;font-size:.95rem}
#logv pre{white-space:pre-wrap;word-break:break-word;text-align:left;margin:12px 0}
#logv button{margin:6px 8px 0 0;padding:8px 18px;border-radius:999px;background:var(--glass);border:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4}
#mus{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:6;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;display:none}
#application{max-width:560px;margin:2rem auto;padding:1.5rem;text-align:center}
#application textarea{width:100%;box-sizing:border-box;padding:.8rem;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--ink);font:inherit;resize:vertical;outline:none}
#application textarea:focus{border-color:var(--rose)}
#application button{margin-top:.8rem;padding:.7rem 1.4rem;border:1px solid var(--line);border-radius:999px;font:inherit;cursor:pointer;background:linear-gradient(135deg,var(--red),#701530)}
#application button:disabled{opacity:.6;cursor:default}
#application hr{border:0;border-top:1px solid var(--line);margin:1.4rem 0}
#appStatus{min-height:1.4em}
@media (prefers-reduced-motion:reduce){.scene.on{animation:none}html{scroll-behavior:auto}}

fromPrefill(CONFIG.logPrefill,"logField","logUrl");fromPrefill(CONFIG.appPrefill,"appField","appUrl");

const appS=scene(`<h2>Something For Me? \u{1F90D}</h2><p>Write your application, or send me something.</p><textarea id="appText" rows="8" placeholder="Write your application here..."></textarea><button id="appSend" type="button">Send application</button><p id="appStatus" aria-live="polite"></p><hr /><p>Or send a photo, video or file:</p><button id="appUpload" type="button">Upload something \u{1F4CE}</button>`);appS.id='application';
function appTarget(text){
  /* If the entry ID is set, the text is also pre-filled into the form via the URL */
  const m=String(C.appUrl).match(/\/forms\/d\/e\/([^\/?#]+)/);
  if(m&&/^entry\.\d+$/.test(C.appField)){
    const u="https://docs.google.com/forms/d/e/"+m[1]+"/viewform?usp=pp_url&"+C.appField+"="+encodeURIComponent(text);
    if(u.length<=1900)return u;
  }
  return C.appUrl;
}
async function copyText(box,text){
  let ok=false;
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);ok=true}}catch(e){}
  if(!ok){try{box.focus();box.select();ok=document.execCommand("copy");box.setSelectionRange(0,0)}catch(e){}}
  return ok;
}
async function sendApplication(){
  const box=document.getElementById("appText"),status=document.getElementById("appStatus"),btn=document.getElementById("appSend"),text=box.value.trim();
  if(!text){status.textContent="Write something first \u{1F90D}";return}
  btn.disabled=true;
  const copied=await copyText(box,text);
  const target=appTarget(text);
  status.textContent=copied?"Copied \u{1F90D} Taking you to the form... (paste it there if the box is empty)":"Taking you to the form... (copy your text first if it does not appear)";
  setTimeout(()=>{window.location.href=target},1200);
}
document.getElementById("appSend").addEventListener("click",sendApplication);

/* particles */
const cv=$('#fx'),x=cv.getContext('2d');let H=[];function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function hearts(){if(reduce)return;for(let i=0;i<26;i++)H.push({x:Math.random()*cv.width,y:cv.height+20+Math.random()*200,s:8+Math.random()*14,v:.6+Math.random()*1.4,a:Math.random()*6,c:Math.random()<.5?'#e0607a':'#a3263f'});if(!hearts.on){hearts.on=1;loop()}}
function loop(){x.clearRect(0,0,cv.width,cv.height);H.forEach(h=>{h.y-=h.v;h.x+=Math.sin(h.a+=.02)*.6;x.globalAlpha=Math.max(0,Math.min(1,h.y/cv.height+.2))*.8;x.fillStyle=h.c;x.font=h.s+'px serif';x.fillText('\u2665',h.x,h.y)});H=H.filter(h=>h.y>-30);
 if(sc[sc.length-1].classList.contains('on')&&H.length<30&&!reduce)hearts();requestAnimationFrame(loop)}
new MutationObserver(()=>{if(last.classList.contains('on'))hearts()}).observe(last,{attributes:true});
